<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Auxilio Mecánico (Cliente)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body
    class="h-screen flex flex-col bg-slate-900 text-white font-[Inter] overflow-hidden max-w-md mx-auto border-x border-slate-800 shadow-3xl">

    <!-- Header Cliente -->
    <header class="p-6 pb-2">
        <div class="flex items-center gap-3">
            <div
                class="h-12 w-12 rounded-full bg-slate-800 border-2 border-emerald-500 flex items-center justify-center">
                <span class="material-icons text-emerald-500">person</span>
            </div>
            <div>
                <h1 class="text-xl font-bold">Hola, Mateo</h1>
                <p class="text-xs text-slate-400">Plan Premium Activo</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 space-y-6 overflow-y-auto">

        <!-- STATUS CARD PRINCIPAL -->
        <div
            class="bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl p-6 shadow-lg shadow-emerald-900/40 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>

            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="bg-white/20 px-2 py-1 rounded text-[10px] font-bold tracking-wider uppercase">Toyota
                        Corolla</span>
                    <h2 class="text-2xl font-bold mt-1">SAA 1234</h2>
                </div>
                <div class="text-right">
                    <div class="text-xs opacity-75">Vence el</div>
                    <div class="font-bold">12 Oct 2026</div>
                </div>
            </div>

            <div class="flex items-end gap-2">
                <span class="text-5xl font-bold">2</span>
                <span class="text-sm mb-2 opacity-80">Auxilios Restantes</span>
            </div>

            <div class="mt-4 w-full bg-black/20 rounded-full h-2">
                <div class="bg-white w-2/3 h-full rounded-full"></div>
            </div>
            <p class="text-[10px] mt-1 text-center opacity-60">Has usado 1 de 3 auxilios anuales</p>
        </div>

        <!-- ACCIONES RÁPIDAS -->
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-8">Acciones</h3>

        <div class="grid grid-cols-2 gap-4">
            <!-- Botón SOS -->
            <a href="sos_demo.html"
                class="col-span-2 bg-red-600 hover:bg-red-700 active:scale-95 transition rounded-2xl p-4 flex items-center gap-4 shadow-lg shadow-red-900/30 group cursor-pointer">
                <div
                    class="h-12 w-12 rounded-full bg-red-800 flex items-center justify-center group-hover:animate-pulse">
                    <span class="material-icons text-2xl">sos</span>
                </div>
                <div>
                    <h4 class="font-bold text-lg">Pedir Grúa</h4>
                    <p class="text-xs text-red-200">Usar en caso de emergencia</p>
                </div>
            </a>

            <!-- Historial -->
            <button
                class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-slate-700">
                <span class="material-icons text-slate-400">history</span>
                <span class="text-xs font-bold text-slate-300">Historial</span>
            </button>

            <!-- Soporte -->
            <button
                class="bg-slate-800 hover:bg-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-slate-700">
                <span class="material-icons text-emerald-500">whatsapp</span>
                <span class="text-xs font-bold text-slate-300">Soporte</span>
            </button>
        </div>

        <!-- FIDELIDAD MINI -->
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-4">Mis Puntos</h3>
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="text-2xl">💎</div>
                <div>
                    <div class="font-bold text-lg">350 pts</div>
                    <div class="text-xs text-slate-400">Nivel Plata</div>
                </div>
            </div>
            <button class="text-xs bg-emerald-600/20 text-emerald-400 px-3 py-1.5 rounded-lg font-bold">Canjear</button>
        </div>

    </main>

</body>

</html>
