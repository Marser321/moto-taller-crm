<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Auxilio Mecánico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 100%, #300000 0%, #000000 70%);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="text-white flex flex-col items-center justify-center h-screen p-4 overflow-hidden relative">

    <!-- Background Pulse Animation -->
    <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
        <div class="w-96 h-96 bg-red-600 rounded-full blur-[150px] opacity-20 animate-pulse"></div>
    </div>

    <div class="z-10 text-center max-w-md w-full">
        <div class="mb-10">
            <div class="text-8xl mb-4 animate-bounce drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">🚨</div>
            <h1 class="text-4xl font-black text-red-500 tracking-tighter uppercase italic drop-shadow-lg">Botón de
                Pánico</h1>
            <p class="text-zinc-400 mt-2 text-lg tracking-wide">Sistema de Emergencias 24/7</p>
        </div>

        <div class="glass-input p-6 rounded-2xl shadow-2xl mb-8">
            <label class="block text-left text-xs font-bold text-zinc-500 mb-2 uppercase tracking-widest">Tu
                Matrícula</label>
            <input type="text" id="matricula" placeholder="SAA 1234"
                class="w-full p-4 rounded-xl bg-black/50 border border-zinc-700 text-center text-3xl font-bold uppercase focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-all text-white placeholder-zinc-700 tracking-wider">
        </div>

        <!-- Botón Principal -->
        <button onclick="simularEnvio()" id="btn-sos"
            class="w-full bg-gradient-to-b from-red-600 to-red-900 hover:from-red-500 hover:to-red-800 text-white font-black py-8 rounded-2xl text-3xl shadow-[0_0_50px_rgba(220,38,38,0.4)] transition-all transform active:scale-95 border border-red-500/30 relative overflow-hidden group">
            <span class="relative z-10 italic">SOLICITAR GRÚA</span>
            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
        </button>

        <p id="status"
            class="mt-8 text-sm text-yellow-500 font-mono hidden flex items-center justify-center gap-2 bg-yellow-900/10 py-2 rounded-lg border border-yellow-500/20">
            <span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse shadow-[0_0_10px_yellow]"></span>
            Obteniendo señal GPS...
        </p>
    </div>

    <!-- Success Modal -->
    <div id="modal-success"
        class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div
            class="glass-input p-8 rounded-3xl max-w-sm text-center border-emerald-500/30 shadow-[0_0_100px_rgba(16,185,129,0.1)]">
            <div
                class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/50 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 text-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                ✓</div>
            <h2 class="text-2xl font-bold text-white mb-2 italic">¡Solicitud Enviada!</h2>
            <p class="text-zinc-400 mb-8 font-light leading-relaxed">El taller ha recibido tu ubicación y matrícula. Una
                unidad va en camino.</p>
            <button onclick="location.reload()"
                class="w-full py-3.5 rounded-xl bg-zinc-800 text-white font-bold hover:bg-zinc-700 transition tracking-wide uppercase text-sm border border-zinc-700">Cerrar</button>
        </div>
    </div>

    <script>
        function simularEnvio() {
            const matricula = document.getElementById('matricula').value.trim();
            if (!matricula) {
                alert("⚠️ Por favor ingresa tu matrícula");
                document.getElementById('matricula').focus();
                return;
            }

            const btn = document.getElementById('btn-sos');
            const status = document.getElementById('status');

            // UI Loading Simulation
            btn.disabled = true;
            btn.innerHTML = "<span class='italic'>ENVIANDO...</span>";
            btn.classList.add('opacity-75', 'grayscale');
            status.classList.remove('hidden');

            // Simulate GPS Delay + Network Request
            setTimeout(() => {
                status.innerText = "📡 Conectando con taller...";
            }, 1500);

            setTimeout(() => {
                // Success State
                document.getElementById('modal-success').classList.remove('hidden');
                btn.innerHTML = "<span class='italic'>SOLICITAR GRÚA</span>";
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'grayscale');
                status.classList.add('hidden');
            }, 3500);
        }
    </script>
</body>

</html>
